<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Setup — Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #161226;
    --night-top: #1b1030;
    --night-mid: #2a1a3d;
    --night-bottom: #402446;
    --torii: #9c3b3b;
    --torii-dark: #7a2c2c;
    --gold: #d8a94e;
    --gold-soft: #e8c887;
    --paper: #fdf6ea;
    --paper-dim: #f2e6cf;
    --lantern: #ff9a4d;
    --lantern-glow: #ffbd7a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:'Zen Maru Gothic', sans-serif;}
  body{
    min-height:100vh;
    background: linear-gradient(180deg, var(--night-top) 0%, var(--night-mid) 55%, var(--night-bottom) 100%);
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* ---------- Sky scene ---------- */
  .scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
  }
  .star{
    position:absolute;
    width:2px;height:2px;
    background:#fff;
    border-radius:50%;
    opacity:.7;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.9;} }

  .moon{
    position:absolute;
    top:8%; right:4%;
    width:110px; height:110px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #fff6df 0%, var(--gold-soft) 55%, var(--gold) 100%);
    box-shadow: 0 0 60px 18px rgba(232,200,135,.35), 0 0 120px 60px rgba(232,200,135,.12);
  }

  .mountains{
    position:absolute;
    bottom:26%;
    left:0; width:100%;
    height:34%;
    background: var(--night-bottom);
    clip-path: polygon(0% 100%, 0% 55%, 8% 40%, 18% 60%, 30% 25%, 42% 55%, 55% 35%, 68% 60%, 80% 30%, 92% 58%, 100% 45%, 100% 100%);
    opacity:.85;
    filter:brightness(.8);
  }

  .temple-wrap{
    position:absolute;
    bottom:0; left:50%;
    transform:translateX(-50%);
    width:min(900px, 100%);
    height:46%;
  }
  .roofline{
    position:absolute;
    bottom:18%;
    left:50%;
    transform:translateX(-50%);
    width:70%;
    height:70%;
  }
  .pagoda-svg, .torii-svg{ position:absolute; fill:var(--ink); }

  .lanterns{
    position:absolute;
    bottom:0;
    left:0; right:0;
    display:flex;
    justify-content:center;
    gap:60px;
    z-index:2;
    pointer-events:none;
  }
  .lantern{
    width:16px; height:22px;
    background: radial-gradient(circle, var(--lantern-glow), var(--lantern) 70%, #b95a1f 100%);
    border-radius:40% 40% 45% 45%;
    box-shadow: 0 0 18px 6px rgba(255,154,77,.55);
    animation: sway 4s ease-in-out infinite;
    margin-bottom: 120px;
  }
  .lantern:nth-child(2n){ animation-delay:.6s; margin-bottom:180px;}
  .lantern:nth-child(3n){ animation-delay:1.1s; margin-bottom:90px;}
  @keyframes sway{ 0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);} }

  .ground-glow{
    position:absolute;
    bottom:0; left:0; right:0;
    height:22%;
    background: linear-gradient(180deg, rgba(216,169,78,0) 0%, rgba(216,169,78,.18) 100%);
  }

  /* ---------- Card ---------- */
  .stage{
    position:relative;
    z-index:5;
    width:100%;
    max-width:460px;
    margin:40px 18px;
  }

  .brandline{
    text-align:center;
    margin-bottom:18px;
    color:var(--gold-soft);
    font-family:'Shippori Mincho', serif;
    letter-spacing:.12em;
    font-size:13px;
    text-transform:uppercase;
    opacity:.85;
    text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 0 8px rgba(0,0,0,.6);
    position:relative;
    z-index:1;
  }

  .card{
    background: linear-gradient(180deg, var(--paper) 0%, var(--paper-dim) 100%);
    border-radius:22px;
    padding:34px 30px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(216,169,78,.35);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:5px;
    background: linear-gradient(90deg, var(--torii), var(--gold), var(--torii));
  }

  .progress{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:22px;
  }
  .dot{
    width:11px;height:14px;
    border-radius:35% 35% 40% 40%;
    background: #d8cbb0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    transition: all .35s ease;
  }
  .dot.active{
    background: radial-gradient(circle, var(--lantern-glow), var(--lantern));
    box-shadow: 0 0 10px 3px rgba(255,154,77,.6);
  }
  .dot.done{
    background: var(--torii);
  }

  .step-eyebrow{
    font-family:'Shippori Mincho', serif;
    color:var(--torii-dark);
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin:0 0 4px;
  }
  h1.step-title{
    font-family:'Shippori Mincho', serif;
    font-size:24px;
    color: var(--torii-dark);
    margin:0 0 22px;
    line-height:1.3;
  }

  label{
    display:block;
    font-size:12.5px;
    color:#6b5f4a;
    margin:0 0 6px;
    font-weight:600;
    letter-spacing:.02em;
  }
  .field{ margin-bottom:16px; }
  input[type=text], input[type=tel], input[type=email], select{
    width:100%;
    padding:12px 14px;
    border-radius:11px;
    border:1.5px solid #e3d5b8;
    background:#fffdf8;
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus, select:focus{
    border-color: var(--torii);
    box-shadow: 0 0 0 3px rgba(156,59,59,.14);
  }
  input::placeholder{ color:#b5a688; }

  .mcq-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:9px;
    margin-bottom:16px;
  }
  .mcq-opt{
    border:1.5px solid #e3d5b8;
    background:#fffdf8;
    border-radius:11px;
    padding:11px 10px;
    font-size:13px;
    color:var(--ink);
    text-align:left;
    cursor:pointer;
    transition: all .18s ease;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .mcq-opt .ic{ font-size:16px; }
  .mcq-opt:hover{ border-color:var(--torii); background:#fff8ee; }
  .mcq-opt.selected{
    border-color:var(--torii);
    background: linear-gradient(135deg, #fbe8e2, #fdf1e6);
    box-shadow: 0 0 0 2px rgba(156,59,59,.12);
  }

  .lang-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:9px;
    margin-bottom:6px;
  }

  .helper{
    font-size:12px;
    color:#8a7c62;
    margin: -8px 0 16px;
  }

  .btn-row{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  button{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:14.5px;
    border:none;
    border-radius:12px;
    padding:13px 18px;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s;
  }
  .btn-primary{
    flex:1;
    background: linear-gradient(135deg, var(--torii), var(--torii-dark));
    color:#fff8ee;
    box-shadow: 0 8px 20px rgba(122,44,44,.35);
  }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 10px 26px rgba(122,44,44,.45); }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-ghost{
    background:transparent;
    color:#8a7c62;
    border:1.5px solid #e3d5b8;
  }
  .btn-ghost:hover{ background:#f7ecd8; }

  .final{
    text-align:center;
    padding:12px 0 4px;
  }
  .final .mark{
    width:64px;height:64px;
    margin:0 auto 16px;
    border-radius:50%;
    background: radial-gradient(circle, var(--lantern-glow), var(--lantern));
    display:flex;align-items:center;justify-content:center;
    font-size:28px;
    box-shadow: 0 0 22px 6px rgba(255,154,77,.5);
  }
  .final h1{ margin-bottom:8px; }
  .final p{ color:#7a6c54; font-size:14px; line-height:1.6; margin:0 0 20px;}
  .summary{
    text-align:left;
    background:#fff8ee;
    border:1px solid #e9dcc0;
    border-radius:12px;
    padding:14px 16px;
    font-size:13px;
    color:#5c503c;
    margin-bottom:18px;
  }
  .summary div{ display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed #e9dcc0;}
  .summary div:last-child{ border-bottom:none; }
  .summary b{ color:var(--ink); font-weight:700; max-width:60%; text-align:right; }

  @media (prefers-reduced-motion: reduce){
    .star, .lantern{ animation:none !important; }
  }

  @media (max-width:480px){
    .card{ padding:26px 18px 22px; }
    .mcq-grid, .lang-grid{ grid-template-columns: 1fr; }
  }
  .password-summary{
  display:flex;
  align-items:center;
  gap:10px;
}

.password-summary span{
  margin-right:auto;
}

.password-summary b{
  font-weight:700;
}

.eye-btn{
  border:none;
  background:transparent;
  padding:4px;
  font-size:20px;
  cursor:pointer;
}
</style>
</head>

function t(key) {
  const language = state.language || 'English';
  return translations[language]?.[key] || translations['English'][key];
}
  function renderProgress(){
    const el = document.getElementById('progress');
    el.innerHTML='';
    for(let i=1;i<=TOTAL_STEPS;i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i===step?' active':'') + (i<step?' done':'');
      el.appendChild(d);
    }
  }

  function goNext(){ if(step<TOTAL_STEPS+1){ step++; render(); } }
  function goBack(){ if(step>1){ step--; render(); } }

  function render(){
    renderProgress();
    const area = document.getElementById('stepArea');

    if(step===1){
      area.innerHTML = `
        <p class="step-eyebrow">Step 1 · Contact</p>
        <h1 class="step-title">Let's start with the basics</h1>
        <div class="field">
          <label>Password</label>
<input type="password" id="password" placeholder="Create your password" value="${state.password || ''}" autocomplete="new-password" style="width:100%;box-sizing:border-box;padding:16px 20px;border:1px solid #ddd3bc;border-radius:16px;background:#fffdf8;font-size:18px;outline:none;">
        </div>
        <div class="field">
          <label>Email address</label>
          <input type="email" id="email" placeholder="you@example.com" value="${state.email}">
        </div>
        <div class="btn-row">
          <button class="btn-primary" onclick="saveStep1()">Continue</button>
        </div>
      `;
    }

    if(step===2){
      area.innerHTML = `
        <p class="step-eyebrow">Step 2 · Your Shop</p>
        <h1 class="step-title">Tell us about your shop</h1>
        <div class="field">
          <label>Shop name</label>
          <input type="text" id="shopName" placeholder="e.g. Sharma General Store" value="${state.shopName}">
        </div>
        <div class="field">
          <label>Shop location</label>
          <input type="text" id="shopLocation" placeholder="Area, city" value="${state.shopLocation}">
        </div>
        <div class="btn-row">
          <button class="btn-ghost" onclick="goBack()">Back</button>
          <button class="btn-primary" onclick="saveStep2()">Continue</button>
        </div>
      `;
    }

    if(step===3){
      const showOther = state.businessType === 'other';
      area.innerHTML = `
        <p class="step-eyebrow">Step 3 · Business Type</p>
        <h1 class="step-title">What kind of business is it?</h1>
        <div class="mcq-grid" id="mcqGrid">
          ${businessOptions.map(o=>`
            <button type="button" class="mcq-opt ${state.businessType===o.v?'selected':''}" data-v="${o.v}">
              <span class="ic">${o.ic}</span><span>${o.l}</span>
            </button>`).join('')}
        </div>
        ${showOther ? `
        <div class="field">
          <label>Describe your business</label>
          <input type="text" id="otherBusiness" placeholder="e.g. Handmade candles, pet supplies..." value="${state.otherBusiness}">
        </div>` : ''}
        <div class="btn-row">
          <button class="btn-ghost" onclick="goBack()">Back</button>
          <button class="btn-primary" id="step3next" onclick="saveStep3()">Continue</button>
        </div>
      `;
      document.querySelectorAll('.mcq-opt').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          state.businessType = btn.getAttribute('data-v');
          render();
        });
      });
    }

    if(step===4){
      area.innerHTML = `
        <p class="step-eyebrow">Step 4 · Language</p>
        <h1 class="step-title">Choose your app language</h1>
        <p class="helper">You can change this anytime in settings.</p>
        <div class="lang-grid" id="langGrid">
          ${languageOptions.map(l=>`
            <button type="button" class="mcq-opt ${state.language===l?'selected':''}" data-v="${l}">
              <span>${l}</span>
            </button>`).join('')}
        </div>
        <div class="btn-row">
          <button class="btn-ghost" onclick="goBack()">Back</button>
          <button class="btn-primary" onclick="saveStep4()">Continue</button>
        </div>
      `;
      document.querySelectorAll('#langGrid .mcq-opt').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          state.language = btn.getAttribute('data-v');
          render();
        });
      });
    } 
    
 if(step===5){
  area.innerHTML = `
    <p class="step-eyebrow">${t('step5')}</p>

    <h1 class="step-title">${t('title5')}</h1>

    <div class="field">
      <label>${t('partnerLabel')}</label>
      <input
        type="text"
        id="partnerName"
        placeholder="${t('partnerPlaceholder')}"
        value="${state.partnerName}"
      >
    </div>

    <div class="helper">${t('partnerHelper')}</div>

    <div class="field">
      <label>${t('ownerLabel')}</label>
      <input
        type="text"
        id="ownerName"
        placeholder="${t('ownerPlaceholder')}"
        value="${state.ownerName}"
      >
    </div>

    <div class="btn-row">
      <button class="btn-ghost" onclick="goBack()">Back</button>

      <button class="btn-primary" onclick="saveStep5()">
        ${t('finish')}
      </button>
    </div>
  `;
 }  

    if(step===6){
      area.innerHTML = `
        <div class="final">
          <div class="mark">⛩️</div>
          <h1 class="step-title">You're all set, ${state.ownerName.split(' ')[0]||'friend'}!</h1>
          <p>Your shop has been registered. ${state.partnerName? state.partnerName+' is ready to help you run things.':''}</p>
          <div class="summary">
            
            <div><span>Email</span><b>${state.email||'—'}</b></div>
           <div class="password-summary">
  <span>Password</span>
  <b id="passwordDisplay">••••••••</b>
  <button type="button" class="eye-btn" onclick="togglePasswordVisibility()" aria-label="Show password">👁</button>
</div> 

            <div><span>Business type</span><b>${businessLabel()}</b></div>
            <div><span>Language</span><b>${state.language||'—'}</b></div>
            <div><span>Assistant name</span><b>${state.partnerName||'—'}</b></div>
          </div>
          <div class="btn-row">
            <button class="btn-ghost" onclick="restart()">Start over</button>
            <button class="btn-primary" onclick="alert('Welcome aboard!')">Go to dashboard</button>
          </div>
        </div>
      `;
    }
  }

  function businessLabel(){
    if(state.businessType==='other') return state.otherBusiness || 'Other';
    const found = businessOptions.find(o=>o.v===state.businessType);
    return found ? found.l : '—';
  }
function togglePasswordVisibility(){
  const display = document.getElementById('passwordDisplay');
  const button = document.querySelector('.eye-btn');

  if(display.textContent === '••••••••'){
    display.textContent = state.password;
    button.textContent = '🙈';
    button.setAttribute('aria-label', 'Hide password');
  } else {
    display.textContent = '••••••••';
    button.textContent = '👁';
    button.setAttribute('aria-label', 'Show password');
  }
}
  
  function saveStep1(){
  state.password = document.getElementById('password').value;
  state.email = document.getElementById('email').value.trim();

  if(!state.password || !state.email){
    flashRequired();
    return;
  }

  if(state.password.length < 6){
    alert('Password must be at least 6 characters.');
    return;
  }

  goNext();
  }
  
  function saveStep2(){
    state.shopName = document.getElementById('shopName').value.trim();
    state.shopLocation = document.getElementById('shopLocation').value.trim();
    if(!state.shopName || !state.shopLocation){ flashRequired(); return; }
    goNext();
  }
  function saveStep3(){
    if(!state.businessType){ flashRequired(); return; }
    if(state.businessType==='other'){
      state.otherBusiness = document.getElementById('otherBusiness').value.trim();
      if(!state.otherBusiness){ flashRequired(); return; }
    }
    goNext();
  }
  function saveStep4(){
    if(!state.language){ flashRequired(); return; }
    goNext();
  }
  async function saveStep5(){
    state.partnerName =
        document.getElementById('partnerName').value.trim();

    state.ownerName =
        document.getElementById('ownerName').value.trim();

    if(!state.partnerName || !state.ownerName){
        flashRequired();
        return;
    }

    try {
        // Create Firebase login account
        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                state.email,
                state.password
            );

        const uid = userCredential.user.uid;

        // Save shop information in Firestore
        await setDoc(doc(db, "shops", uid), {
            email: state.email,
            shopName: state.shopName,
            shopLocation: state.shopLocation,
            businessType: state.businessType,
            otherBusiness: state.otherBusiness,
            language: state.language,
            partnerName: state.partnerName,
            ownerName: state.ownerName
        });

        // Go to final page
        goNext();

    } catch(error) {
        console.error(error);
        alert(error.message);
    }
  }
  function restart(){
    step=1;
    for(const k in state) state[k]='';
    render();
  }
  function flashRequired(){
    const card = document.querySelector('.card');
    card.style.boxShadow = '0 20px 60px rgba(0,0,0,.45), 0 0 0 2px rgba(156,59,59,.7)';
    setTimeout(()=>{ card.style.boxShadow=''; },350);
  }

  render();
  window.saveStep1 = saveStep1;
window.saveStep2 = saveStep2;
window.saveStep3 = saveStep3;
window.saveStep4 = saveStep4;
window.saveStep5 = saveStep5;

window.goBack = goBack;
window.restart = restart;
window.togglePasswordVisibility = togglePasswordVisibility;
</script>
</body>
</html>
