<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoten — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #161226;
    --night-top: #1b1030;
    --night-mid: #2a1a3d;
    --night-bottom: #402446;
    --torii: #9c3b3b;
    --torii-dark: #7a2c2c;
    --gold: #d8a94e;
    --gold-soft: #e8c887;
    --paper: #fdf6ea;
    --paper-dim: #f2e6cf;
    --lantern: #ff9a4d;
    --lantern-glow: #ffbd7a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:'Zen Maru Gothic', sans-serif;}
  body{
    min-height:100vh;
    background: linear-gradient(180deg, var(--night-top) 0%, var(--night-mid) 55%, var(--night-bottom) 100%);
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* ---------- Sky scene ---------- */
  .scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
  }
  .star{
    position:absolute;
    width:2px;height:2px;
    background:#fff;
    border-radius:50%;
    opacity:.7;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.9;} }

  .moon{
    position:absolute;
    top:8%; right:4%;
    width:110px; height:110px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #fff6df 0%, var(--gold-soft) 55%, var(--gold) 100%);
    box-shadow: 0 0 60px 18px rgba(232,200,135,.35), 0 0 120px 60px rgba(232,200,135,.12);
  }

  .mountains{
    position:absolute;
    bottom:26%;
    left:0; width:100%;
    height:34%;
    background: var(--night-bottom);
    clip-path: polygon(0% 100%, 0% 55%, 8% 40%, 18% 60%, 30% 25%, 42% 55%, 55% 35%, 68% 60%, 80% 30%, 92% 58%, 100% 45%, 100% 100%);
    opacity:.85;
    filter:brightness(.8);
  }

  .temple-wrap{
    position:absolute;
    bottom:0; left:50%;
    transform:translateX(-50%);
    width:min(900px, 100%);
    height:46%;
  }
  .roofline{
    position:absolute;
    bottom:18%;
    left:50%;
    transform:translateX(-50%);
    width:70%;
    height:70%;
  }
  .pagoda-svg, .torii-svg{ position:absolute; fill:var(--ink); }

  .lanterns{
    position:absolute;
    bottom:0;
    left:0; right:0;
    display:flex;
    justify-content:center;
    gap:60px;
    z-index:2;
    pointer-events:none;
  }
  .lantern{
    width:16px; height:22px;
    background: radial-gradient(circle, var(--lantern-glow), var(--lantern) 70%, #b95a1f 100%);
    border-radius:40% 40% 45% 45%;
    box-shadow: 0 0 18px 6px rgba(255,154,77,.55);
    animation: sway 4s ease-in-out infinite;
    margin-bottom: 120px;
  }
  .lantern:nth-child(2n){ animation-delay:.6s; margin-bottom:180px;}
  .lantern:nth-child(3n){ animation-delay:1.1s; margin-bottom:90px;}
  @keyframes sway{ 0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);} }

  .ground-glow{
    position:absolute;
    bottom:0; left:0; right:0;
    height:22%;
    background: linear-gradient(180deg, rgba(216,169,78,0) 0%, rgba(216,169,78,.18) 100%);
  }

  /* ---------- Login card ---------- */
  .stage{
    position:relative;
    z-index:5;
    width:100%;
    max-width:400px;
    margin:40px 18px;
  }

  .brandline{
    text-align:center;
    margin-bottom:18px;
    color:var(--gold-soft);
    font-family:'Shippori Mincho', serif;
    letter-spacing:.12em;
    font-size:13px;
    text-transform:uppercase;
    opacity:.85;
    text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 0 8px rgba(0,0,0,.6);
    position:relative;
    z-index:1;
  }

  .card{
    background: linear-gradient(180deg, var(--paper) 0%, var(--paper-dim) 100%);
    border-radius:22px;
    padding:36px 30px 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(216,169,78,.35);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:5px;
    background: linear-gradient(90deg, var(--torii), var(--gold), var(--torii));
  }

  .mark{
    display:flex;
    justify-content:center;
    margin-bottom:14px;
  }
  .mark svg{ width:46px; height:46px; }

  .shop-name{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:30px;
    text-align:center;
    color: var(--torii-dark);
    margin:0;
  }
  .shop-sub{
    text-align:center;
    color:#8a7c62;
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin:6px 0 26px;
  }

  form{ display:flex; flex-direction:column; }

  label{
    display:block;
    font-size:12.5px;
    color:#6b5f4a;
    margin:0 0 6px;
    font-weight:600;
    letter-spacing:.02em;
  }
  .field{ margin-bottom:16px; }
  input[type=email], input[type=password]{
    width:100%;
    padding:12px 14px;
    border-radius:11px;
    border:1.5px solid #e3d5b8;
    background:#fffdf8;
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus{
    border-color: var(--torii);
    box-shadow: 0 0 0 3px rgba(156,59,59,.14);
  }
  input::placeholder{ color:#b5a688; }

  .row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12.5px;
    color:#8a7c62;
    margin-bottom:18px;
  }
  .remember{ display:flex; align-items:center; gap:7px; }
  .remember input{ accent-color: var(--torii); width:14px; height:14px; }
  .forgot{
    color: var(--torii-dark);
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .forgot:hover, .forgot:focus-visible{ border-bottom-color: var(--torii-dark); }

  button{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:12px;
    padding:13px 18px;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s;
  }
  .btn-primary{
    width:100%;
    background: linear-gradient(135deg, var(--torii), var(--torii-dark));
    color:#fff8ee;
    box-shadow: 0 8px 20px rgba(122,44,44,.35);
    letter-spacing:.03em;
  }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 10px 26px rgba(122,44,44,.45); }
  .btn-primary:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    color:#8a7c62;
    font-size:11.5px;
    margin:20px 0 4px;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#e9dcc0;
  }

  .footer-text{
    text-align:center;
    font-size:13px;
    color:#8a7c62;
    margin-top:18px;
  }
  .footer-text a{ color: var(--torii-dark); text-decoration:none; font-weight:600; }
  .footer-text a:hover, .footer-text a:focus-visible{ text-decoration:underline; }

  @media (prefers-reduced-motion: reduce){
    .star, .lantern{ animation:none !important; }
  }

  @media (max-width:480px){
    .card{ padding:28px 20px 24px; }
    .shop-name{ font-size:26px; }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="moon"></div>
  <div class="mountains"></div>

  <div class="temple-wrap">
    <svg class="roofline" viewBox="0 0 600 260" preserveAspectRatio="xMidYMax meet">
      <!-- pagoda silhouette -->
      <g fill="#161226">
        <rect x="270" y="150" width="60" height="70"/>
        <polygon points="240,150 360,150 380,130 220,130"/>
        <rect x="282" y="110" width="36" height="45"/>
        <polygon points="260,110 340,110 355,92 245,92"/>
        <rect x="290" y="72" width="20" height="42"/>
        <polygon points="273,72 327,72 338,58 262,58"/>
        <rect x="296" y="30" width="8" height="30"/>
        <circle cx="300" cy="26" r="6"/>
      </g>
      <!-- torii gate left -->
      <g fill="#161226">
        <rect x="30" y="120" width="14" height="100"/>
        <rect x="95" y="120" width="14" height="100"/>
        <rect x="18" y="110" width="105" height="12"/>
        <rect x="24" y="128" width="93" height="8"/>
      </g>
      <!-- torii gate right -->
      <g fill="#161226">
        <rect x="480" y="120" width="14" height="100"/>
        <rect x="545" y="120" width="14" height="100"/>
        <rect x="468" y="110" width="105" height="12"/>
        <rect x="474" y="128" width="93" height="8"/>
      </g>
    </svg>
  </div>

  <div class="lanterns">
    <div class="lantern"></div>
    <div class="lantern"></div>
    <div class="lantern"></div>
    <div class="lantern"></div>
    <div class="lantern"></div>
  </div>

  <div class="ground-glow"></div>
</div>

<div class="stage">
  <div class="brandline">— 商 店 · Shoten —</div>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 46 46" fill="none">
        <line x1="23" y1="8" x2="23" y2="16" stroke="var(--gold)" stroke-width="1.5"/>
        <ellipse cx="23" cy="27" rx="13" ry="17" fill="var(--torii)"/>
        <ellipse cx="23" cy="27" rx="13" ry="17" stroke="#3a2216" stroke-width="1.2" fill="none"/>
        <line x1="10" y1="27" x2="36" y2="27" stroke="#3a2216" stroke-width="0.8"/>
        <ellipse cx="23" cy="27" rx="5.5" ry="7.5" fill="var(--lantern-glow)"/>
      </svg>
    </div>
    <h1 class="shop-name">Shoten</h1>
    <p class="shop-sub">Evening Market · Sign in</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div class="row-between">
        
<label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
  <input
    type="checkbox"
    id="showPassword"
    style="width:18px; height:18px; accent-color:#963737;"
  >
  <span>Show password</span>
</label>

        <a class="forgot" href="Forgot Password – Shoten (1).html">Forgot password?</a>
      </div>
      <button class="btn-primary" type="submit">Enter the shop</button>
      <p id="loginMessage" role="status"></p>
    </form>

    <div class="divider">or</div>
    <p class="footer-text">New here? <a href="account_creation.html">Create an account</a></p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  
const firebaseConfig = {
apiKey: "AIzaSyD_XAHQG-Pp4cNsMf1Edj00DwOMDOW_Nps",
authDomain: "shoten-72c98.firebaseapp.com",
projectId: "shoten-72c98",
storageBucket: "shoten-72c98.firebasestorage.app",
messagingSenderId: "127926934219",
appId: "1:127926934219:web:e9c8b1a1c2937b9422994e",
measurementId: "G-HBNSDYZY04"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


  // ---------- scatter stars (same as reference) ----------
  const scene = document.getElementById('scene');
  for(let i=0;i<70;i++){
    const s = document.createElement('div');
    s.className='star';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*55+'%';
    s.style.animationDelay = (Math.random()*3.5)+'s';
    s.style.width = s.style.height = (Math.random()*1.8+1)+'px';
    scene.appendChild(s);
  }
  
const passwordInput = document.querySelector(
  'input[type="password"]'
);

const showPassword = document.getElementById(
  'showPassword'
);

showPassword.addEventListener('change', function () {
  passwordInput.type = this.checked
    ? 'text'
    : 'password';
});

const loginForm = document.getElementById('loginForm');
const loginMessage = document.getElementById('loginMessage');


loginForm.addEventListener('submit', async function (event) {
  event.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  loginMessage.textContent = 'Signing in...';

  try {
    // Step 1: Authenticate shopkeeper
    const userCredential = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    const user = userCredential.user;

    // Step 2: Find their shop using Firebase UID
    const shopRef = doc(db, "shops", user.uid);
    const shopSnap = await getDoc(shopRef);

    // Step 3: Check whether shop exists
    if (!shopSnap.exists()) {
      loginMessage.textContent =
        'Shop details not found. Please contact support.';
      return;
    }

    // Step 4: Open dashboard
    window.location.href = './shoten.html';

  } catch (error) {

    if (
      error.code === 'auth/invalid-credential' ||
      error.code === 'auth/wrong-password' ||
      error.code === 'auth/user-not-found'
    ) {
      loginMessage.textContent = 'Incorrect email or password.';

    } else if (error.code === 'auth/invalid-email') {
      loginMessage.textContent = 'Please enter a valid email.';

    } else {
      loginMessage.textContent = 'Login failed. Please try again.';
      console.error(error);
    }
  }
});


</script>
</body>
</html>
