<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoten</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F7E7CF;--card:#fff;--ink:#1A1A1E;--mut:#6b6458;--line:#e6d5b8;--or:#DD5F2C;--teal:#2C7A67;--rust:#B23A26;--hd:#1A1A1E;--hdt:#F7E7CF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141417;--card:#222227;--ink:#f3e9d8;--mut:#a79d8c;--line:#35353b;--hd:#0c0c0e;--hdt:#F7E7CF}}
:root[data-theme="dark"]{--bg:#141417;--card:#222227;--ink:#f3e9d8;--mut:#a79d8c;--line:#35353b;--hd:#0c0c0e;--hdt:#F7E7CF}
*{box-sizing:border-box}html,body{margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font:15px/1.45 'IBM Plex Sans',system-ui,sans-serif;
  padding-bottom:84px;
  visibility:hidden;
}
h1,h2,h3,.big{font-family:Fraunces,Georgia,serif;margin:0}
header{background:var(--hd);color:var(--hdt);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:22px}header small{opacity:.7;display:block;font-size:11px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
.tg{width:44px;height:44px;border-radius:50%;border:1px solid #F7E7CF55;background:transparent;color:var(--hdt);cursor:pointer;display:grid;place-items:center;padding:0}.tg:active{transform:scale(.92)}.tg svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.big{font-size:28px}.mid{font-size:20px;font-weight:600}
.hero{background:var(--hd);color:var(--hdt);border:0}.hero .lbl{color:#d9c9ae}
.g{color:var(--teal)}.r{color:var(--rust)}.o{color:var(--or)}
.btn{min-height:46px;border:0;border-radius:12px;padding:0 16px;font:600 15px inherit;font-family:inherit;background:var(--or);color:#fff;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.sm{min-height:36px;padding:0 12px;font-size:13px}.btn.red{background:var(--rust)}.btn.full{width:100%}
.btn:active{transform:scale(.97)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row>div:first-child{min-width:0}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:#2c7a6722;color:var(--teal);white-space:nowrap}.badge.w{background:#dd5f2c22;color:var(--or)}.badge.b{background:#b23a2622;color:var(--rust)}
input,select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;background:var(--card);color:var(--ink)}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;background:none;border:0;padding:8px 0 6px;color:var(--mut);font:500 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;cursor:pointer}
nav button.on{color:var(--or);font-weight:600}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.qa button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;color:var(--ink);font:500 13px inherit;font-family:inherit;min-height:70px;cursor:pointer}.qa b{display:block;font-size:20px;color:var(--or)}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px}.bars div{flex:1;text-align:center;font-size:10px;color:var(--mut)}.bars i{display:block;background:var(--or);border-radius:6px 6px 0 0;min-height:3px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pills button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;min-height:40px;cursor:pointer}.pills .on{background:var(--ink);color:var(--bg)}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}#modal.on{display:flex}
#modal>div{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}
.err{color:var(--rust);font-size:13px;min-height:18px;margin:8px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}#toast.on{opacity:1}
.bub{padding:10px 14px;border-radius:14px;margin:6px 0;max-width:88%}.q{background:var(--or);color:#fff;margin-left:auto}.a{background:var(--card);border:1px solid var(--line)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
@media(min-width:700px){.qa{grid-template-columns:repeat(6,1fr)}}
</style></head><body>
<header><div><h1 id="hn"></h1><small>Shoten · prototype, data stays on this device</small>
<small id="syncStatus" style="display:block;margin-top:5px;color:#DD5F2C">
  Checking connection...
</small></div><div style="display:flex;align-items:center;gap:12px"><div style="text-align:right"><small>Cash in hand</small><b id="hc"></b></div><button id="tg" class="tg" data-a="theme" type="button"></button></div></header>
<main id="app"></main>
<nav id="nav"></nav><div id="modal"></div><div id="toast" role="status"></div>
<script>
const KEY='shoten_dashboard_v3',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN');
const DAY=864e5,day0=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()},isT=t=>day0(t)===day0(Date.now());
const fmtD=t=>new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const ACC={Cash:'cash',UPI:'upi',Card:'bank',Bank:'bank'};
function seed(){const n=Date.now();return{shop:{name:'My Kirana Store',phone:''},theme:'auto',open:{cash:5000,upi:0,bank:10000},
products:[{id:'p1',name:'Basmati Rice 1kg',cost:70,price:90,stock:40,min:10},{id:'p2',name:'Toor Dal 1kg',cost:120,price:145,stock:6,min:10},{id:'p3',name:'Amul Milk 500ml',cost:25,price:28,stock:0,min:12},{id:'p4',name:'Parle-G Biscuit',cost:8,price:10,stock:80,min:20}],
customers:[{id:'c1',name:'Ramesh Sharma',phone:'',open:300}],suppliers:[{id:'s1',name:'Gupta Wholesale',phone:'',open:0}],
sales:[],purchases:[],expenses:[],cpay:[],spay:[]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
const save = () => {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  localStorage.setItem("shoten_local_updated_at", String(Date.now()));
  } catch(e) {}

  const status = document.getElementById("syncStatus");

if (!navigator.onLine) {
  status.textContent = "Offline — saved on this device";
  status.style.color = "#DD5F2C";

} else if (window.shotenCloudSave) {
  status.textContent = "Syncing...";
  status.style.color = "#DDAA44";

  Promise.resolve(window.shotenCloudSave(S))
    .then(() => {
      status.textContent = "Synced";
      status.style.color = "#36B37E";
    })
    .catch(() => {
      status.textContent = "Sync pending — saved on this device";
      status.style.color = "#DD5F2C";
    });

} else {
  status.textContent = "Saved on this device — waiting to sync";
  status.style.color = "#DD5F2C";
}
};
  window.addEventListener("online", async () => {
  const status = document.getElementById("syncStatus");

  if (!window.shotenCloudSave) {
    status.textContent = "Waiting for cloud connection...";
    return;
  }

  status.textContent = "Syncing...";
  status.style.color = "#DDAA44";

  try {
    await window.shotenCloudSave(S);
    status.textContent = "Synced";
    status.style.color = "#36B37E";
  } catch (error) {
    status.textContent = "Sync pending — saved on this device";
    status.style.color = "#DD5F2C";
  }
});

window.addEventListener("offline", () => {
  const status = document.getElementById("syncStatus");
  status.textContent = "Offline — saved on this device";
  status.style.color = "#DD5F2C";
}
);
// ---- business logic (single source of truth) ----
const L={
custBal:c=>c.open+S.sales.filter(s=>s.cid===c.id&&s.method==='Udhaar').reduce((a,s)=>a+s.total,0)-S.cpay.filter(p=>p.cid===c.id).reduce((a,p)=>a+p.amt,0),
supBal:s=>s.open+S.purchases.filter(p=>p.sid===s.id).reduce((a,p)=>a+p.total-p.paid,0)-S.spay.filter(p=>p.sid===s.id).reduce((a,p)=>a+p.amt,0),
bal(){const b={...S.open};S.sales.forEach(s=>{if(s.method!=='Udhaar')b[ACC[s.method]]+=s.total});S.cpay.forEach(p=>b[ACC[p.method]]+=p.amt);
 S.expenses.forEach(e=>b[ACC[e.method]]-=e.amt);S.purchases.forEach(p=>{if(p.paid)b[ACC[p.method]]-=p.paid});S.spay.forEach(p=>b[ACC[p.method]]-=p.amt);return b},
status(p){return p.stock<=0?['Out of stock','b']:p.stock<=p.min?['Low stock','w']:['In stock','']},
today(){const sl=S.sales.filter(s=>isT(s.t)),sales=sl.reduce((a,s)=>a+s.total,0),cogs=sl.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.cost*i.qty,0),0),
 exp=S.expenses.filter(e=>isT(e.t)).reduce((a,e)=>a+e.amt,0),pur=S.purchases.filter(p=>isT(p.t)).reduce((a,p)=>a+p.total,0);
 const q={};sl.forEach(s=>s.items.forEach(i=>q[i.name]=(q[i.name]||0)+i.qty));const top=Object.entries(q).sort((a,b)=>b[1]-a[1]);
 return{sl,sales,cogs,exp,pur,net:sales-cogs-exp,top}},
invVal:()=>S.products.reduce((a,p)=>a+p.cost*Math.max(0,p.stock),0),
owed:()=>S.customers.map(c=>[c,L.custBal(c)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),
payable:()=>S.suppliers.reduce((a,s)=>a+Math.max(0,L.supBal(s)),0),
points:()=>S.sales.length*10+S.products.filter(p=>p.stock>0).length*3+S.customers.length*2+S.suppliers.length*2,
findCust:n=>S.customers.find(c=>c.name.trim().toLowerCase()===n.trim().toLowerCase())};
// ---- ui state ----
let tab='home',sub=null,cart=[],pm='Cash',busy=false,openIds={},ask=[];
const IC={home:'M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z',bill:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',box:'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',book:'M5 4h12a2 2 0 012 2v14H7a2 2 0 01-2-2zM9 8h6',more:'M5 12h.01M12 12h.01M19 12h.01'};
const ico=n=>`<svg viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove('on'),2400)};
const num=v=>{const n=parseFloat(v);return isNaN(n)?NaN:n};
function fld(id,label,type='text',val='',x=''){return `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}" ${x}>`}
function sel(id,label,opts,v){return `<label for="${id}">${label}</label><select id="${id}">${opts.map(o=>{const [a,b]=Array.isArray(o)?o:[o,o];return `<option value="${esc(a)}" ${a===v?'selected':''}>${esc(b)}</option>`}).join('')}</select>`}
function modal(title,body,okLabel,fn){const m=$('#modal');m.innerHTML=`<div role="dialog" aria-label="${esc(title)}"><h2 style="margin-bottom:6px">${esc(title)}</h2>${body}<div class="err" id="err"></div><div class="grid"><button class="btn sec" id="mx">Cancel</button><button class="btn" id="mok">${okLabel}</button></div></div>`;m.classList.add('on');
 $('#mx').onclick=()=>m.classList.remove('on');$('#mok').onclick=()=>{const e=fn();if(e){$('#err').textContent=e;return}m.classList.remove('on');save();render()}}
const v=id=>$('#'+id).value;
// ---- forms ----
const F={
product(){modal('Add product',fld('n','Product name')+fld('c','Purchase price (₹)','number','','min=0 step=any inputmode=decimal')+fld('p','Selling price (₹)','number','','min=0 step=any inputmode=decimal')+fld('s','Opening stock','number','0','min=0')+fld('m','Low-stock alert at','number','5','min=0'),'Save',()=>{
 const n=v('n').trim(),c=num(v('c')),p=num(v('p')),s=num(v('s')),m=num(v('m'));if(!n)return'Enter a product name.';if(S.products.some(x=>x.name.toLowerCase()===n.toLowerCase()))return'This product already exists.';
 if(!(c>=0)||!(p>0))return'Enter valid prices.';if(!(s>=0)||!(m>=0))return'Stock values cannot be negative.';S.products.push({id:uid(),name:n,cost:c,price:p,stock:s,min:m});toast('Product added')})},
restock(id){const p=S.products.find(x=>x.id===id);modal('Add stock · '+p.name,fld('q','Quantity to add','number','','min=1 inputmode=numeric'),'Add',()=>{const q=num(v('q'));if(!(q>0))return'Enter a quantity above zero.';p.stock+=q;toast('Stock updated')})},
customer(){modal('Add customer',fld('n','Name')+fld('ph','Phone (optional)','tel')+fld('o','Opening balance owed (₹)','number','0','min=0 step=any'),'Save',()=>{
 const n=v('n').trim(),o=num(v('o'))||0;if(!n)return'Enter a name.';if(o<0)return'Balance cannot be negative.';if(L.findCust(n))return'A customer with this name already exists.';S.customers.push({id:uid(),name:n,phone:v('ph').trim(),open:o,t:Date.now()});toast('Customer added')})},
collect(id){const c=S.customers.find(x=>x.id===id),b=L.custBal(c);modal('Collect from '+c.name,`<p>Outstanding: <b>${inr(b)}</b></p>`+fld('a','Amount (₹)','number','','min=1 step=any')+sel('m','Received via',['Cash','UPI','Bank']),'Record',()=>{
 const a=num(v('a'));if(!(a>0))return'Enter a valid amount.';if(a>b+1e-9)return'Amount is more than the '+inr(b)+' owed.';S.cpay.push({id:uid(),t:Date.now(),cid:id,amt:a,method:v('m')});toast('Payment recorded')})},
supplier(){modal('Add supplier',fld('n','Supplier name')+fld('ph','Phone (optional)','tel'),'Save',()=>{const n=v('n').trim();if(!n)return'Enter a name.';if(S.suppliers.some(s=>s.name.toLowerCase()===n.toLowerCase()))return'Supplier already exists.';S.suppliers.push({id:uid(),name:n,phone:v('ph').trim(),open:0});toast('Supplier added')})},
paySup(id){const s=S.suppliers.find(x=>x.id===id),b=L.supBal(s);modal('Pay '+s.name,`<p>You owe: <b>${inr(b)}</b></p>`+fld('a','Amount (₹)','number','','min=1 step=any')+sel('m','Paid via',['Cash','UPI','Bank']),'Pay',()=>{
 const a=num(v('a'));if(!(a>0))return'Enter a valid amount.';if(a>b+1e-9)return'Amount is more than you owe.';const m=v('m');if(L.bal()[ACC[m]]<a)return'Not enough '+m+' balance.';S.spay.push({id:uid(),t:Date.now(),sid:id,amt:a,method:m});toast('Payment recorded')})},
expense(){const cats=['Electricity','Rent','Salary','Transport','Packaging','Maintenance','Internet/phone','Miscellaneous','Other — enter my own category'];
 modal('Add expense',fld('a','Amount (₹)','number','','min=1 step=any')+sel('cat','Category',cats)+`<div id="oth" style="display:none">${fld('oc','Your category')}</div>`+sel('m','Paid via',['Cash','UPI','Bank'])+fld('d','Date','date',new Date().toISOString().slice(0,10)),'Save',()=>{
 const a=num(v('a'));let cat=v('cat');if(cat.startsWith('Other'))cat=v('oc').trim();if(!(a>0))return'Enter a valid amount.';if(!cat)return'Enter a category.';if(!v('d'))return'Pick a date.';
 const m=v('m');if(L.bal()[ACC[m]]<a)return'Not enough '+m+' balance for this expense.';S.expenses.push({id:uid(),t:new Date(v('d')+'T12:00:00').getTime(),amt:a,cat,method:m});toast('Expense saved')});
 $('#cat').onchange=e=>$('#oth').style.display=e.target.value.startsWith('Other')?'block':'none'},
purchase(){if(!S.suppliers.length||!S.products.length){toast('Add a supplier and a product first');return}
 modal('Record purchase',sel('s','Supplier',S.suppliers.map(x=>[x.id,x.name]))+sel('p','Product',S.products.map(x=>[x.id,x.name]))+fld('q','Quantity','number','','min=1')+fld('r','Price per unit (₹)','number','','min=0 step=any')+sel('st','Payment status',[['unpaid','Unpaid — add to supplier Udhaar'],['paid','Paid now'],['part','Part paid']])+`<div id="pa" style="display:none">${fld('pamt','Amount paid now (₹)','number','','min=0 step=any')}</div>`+sel('m','Paid via',['Cash','UPI','Bank']),'Save',()=>{
 const q=num(v('q')),r=num(v('r')),tot=q*r,st=v('st');if(!(q>0))return'Enter a quantity above zero.';if(!(r>=0))return'Enter a valid price.';
 let paid=st==='paid'?tot:st==='part'?num(v('pamt')):0;if(!(paid>=0)||paid>tot)return'Amount paid must be between 0 and '+inr(tot)+'.';if(paid>0&&L.bal()[ACC[v('m')]]<paid)return'Not enough '+v('m')+' balance.';
 S.products.find(x=>x.id===v('p')).stock+=q;S.purchases.push({id:uid(),t:Date.now(),sid:v('s'),pid:v('p'),qty:q,rate:r,total:tot,paid,method:v('m')});toast('Purchase recorded')});
 $('#st').onchange=e=>$('#pa').style.display=e.target.value==='part'?'block':'none'}};
// ---- billing ----
const cartTotal=()=>cart.reduce((a,i)=>a+i.qty*i.price,0);
const act={
tab(d){tab=d.t;sub=d.s||null;render()},f(d){F[d.n](d.id)},
sub(d){sub=d.s||null;render()},
add(d){const p=S.products.find(x=>x.id===d.id),i=cart.find(x=>x.pid===p.id);if(p.stock<=0)return toast('Out of stock');if(i){if(i.qty+1>p.stock)return toast('Only '+p.stock+' in stock');i.qty++}else cart.push({pid:p.id,name:p.name,qty:1,price:p.price,cost:p.cost});render()},
qty(d){const i=cart[d.i],p=S.products.find(x=>x.id===i.pid),q=i.qty+(+d.d);if(q<1)cart.splice(d.i,1);else if(q>p.stock)return toast('Only '+p.stock+' in stock');else i.qty=q;render()},
pm(d){pm=d.m;render()},
toggle(d){openIds[d.id]=!openIds[d.id];render()},
done(){if(busy)return;busy=true;try{
 if(!cart.length)return toast('Add at least one item');const name=v('cn').trim();if(pm==='Udhaar'&&!name)return toast('Enter customer name for Udhaar');
 for(const i of cart){const p=S.products.find(x=>x.id===i.pid);if(!(i.qty>0)||!(i.price>=0))return toast('Check quantity and price');if(i.qty>p.stock)return toast('Not enough stock: '+p.name)}
 let cid=null;if(name){let c=L.findCust(name);if(!c){c={id:uid(),name:name.replace(/\s+/g,' '),phone:'',open:0,t:Date.now()};S.customers.push(c)}cid=c.id}
 const total=cartTotal();cart.forEach(i=>S.products.find(x=>x.id===i.pid).stock-=i.qty);
 S.sales.push({id:uid(),t:Date.now(),items:cart.map(i=>({...i})),total,method:pm,cid});cart=[];pm='Cash';save();toast('Sale of '+inr(total)+' recorded');render()}finally{setTimeout(()=>busy=false,400)}},
theme(){S.theme=isDark()?'light':'dark';save();render()},reset(){modal('Reset demo data','<p>This erases ALL records on this device and restores the demo data. This cannot be undone.</p>','Reset everything',()=>{S=seed();cart=[];ask=[];toast('Demo data restored')})},
saveSet(){S.shop.name=v('sn').trim()||'My Shop';S.shop.phone=v('sp').trim();S.theme=v('th');save();render();toast('Settings saved')},
export(){const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(S,null,1));a.download='shoten-backup.json';a.click()},
ask(d){const T=L.today(),o=L.owed();const A={

 window.shotenLogout = async function() {

  const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.replace("./shoten-login.html");

  }

  
  localStorage.setItem("shoten_offline_access", "yes");
  
  try {

          data: data,
          updatedAt: Date.now()
        });
     } catch (error) {
  console.error("Cloud save failed:", error);
  throw error;
      }

    // Check whether dashboard data already exists
    const snapshot = await getDoc(cloudRef(user));

    if (snapshot.exists()) {

  const cloudDoc = snapshot.data();
  const cloudData = cloudDoc.data;

  const localTime = Number(
    localStorage.getItem("shoten_local_updated_at") || 0
  );

  const cloudTime = Number(cloudDoc.updatedAt || 0);

  if (cloudData && typeof cloudData === "object") {

    if (localTime > cloudTime) {

      // Local data is newer: upload it
      await window.shotenCloudSave(
        window.shotenGetData()
      );

    } else {

      // Cloud data is newer or equally recent: download it
      window.shotenApplyCloudData(cloudData);

      localStorage.setItem(KEY, JSON.stringify(cloudData));
      localStorage.setItem(
        "shoten_local_updated_at",
        String(cloudTime)
      );

    }
  }

    } else {

      // First connection: upload existing local data
      await window.shotenCloudSave(
        window.shotenGetData()
      );

    }

    document.body.style.visibility = "visible";
const status = document.getElementById("syncStatus");
if (status) {
